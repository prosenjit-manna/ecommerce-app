# Prometheus scrape config for local development (compose service `prometheus`, profile `apps`).
# Reload after editing, without a restart:  curl -X POST http://localhost:9090/-/reload
# Check it:  podman compose --profile apps run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Apollo Router: requests, errors and latency per subgraph as seen from the edge.
  # Same compose network, so the service name resolves.
  - job_name: router
    static_configs:
      - targets: ["router:9080"]
        labels:
          service: api-gateway

  # Subgraphs run on the host with `yarn dev` until Phase 2, then this becomes `auth:4001`.
  # auth shows DOWN (404) until it exposes /metrics (service-kit metrics plugin, roadmap week 2).
  - job_name: services
    static_configs:
      - targets: ["host.containers.internal:4001"]
        labels:
          service: auth

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
