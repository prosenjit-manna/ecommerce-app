# Local development dependencies (works with `podman compose` and `docker compose`).
# Run from the repo root.
#
#   podman compose up -d        # start everything
#   podman compose ps           # check health
#   podman compose down         # stop (data is kept)
#   podman compose down -v      # stop and wipe all data
#
# API gateway (profile `apps`): Apollo Router on http://localhost:4000/graphql, plus a rover
# container that recomposes the supergraph whenever a subgraph schema changes.
# Subgraphs still run on the host (`yarn dev` in services/<name>) until Phase 2.
#   podman compose --profile apps up -d                     # deps + gateway
#   podman compose --profile apps up -d --build supergraph  # after bumping rover / federation versions
#   podman compose --profile apps logs -f supergraph router
#   podman compose --profile apps exec supergraph cat /supergraph/supergraph.graphql
#
# Metrics (profile `apps`): Prometheus scrapes the router (and later every service's /metrics),
# Grafana shows the dashboards in infra/observability/grafana/dashboards/.
#   Prometheus: http://localhost:9090/targets     Grafana: http://localhost:3000 (no login locally)
#   curl -X POST http://localhost:9090/-/reload   # after editing prometheus.yml
#   podman compose --profile apps restart grafana # after adding or editing a dashboard JSON
#
# Services in dev mode (profile `services`, opt-in): each subgraph runs in a container with
# hot reload, instead of `yarn dev` on the host. Use one or the other: both bind the same port.
#   podman compose --profile apps --profile services up -d
#   podman compose --profile services logs -f auth
#   podman compose --profile services restart auth   # after `yarn build` in packages/service-kit
# The router and Prometheus reach a subgraph at host.containers.internal:<port> in both modes:
# the container publishes that port on the host, so nothing has to be switched.
#
# Images use fully-qualified names (docker.io/...) so Podman doesn't prompt for a registry.
# Ports bind to 127.0.0.1 only, so nothing is exposed to the network.

name: ecommerce

# Shared by every Node.js service in dev mode. Source is bind-mounted and `tsx watch` reloads on
# change; node_modules lives in a per-service volume because native modules (argon2) built on
# macOS don't load on Linux.
x-node-dev: &node-dev
  image: docker.io/library/node:24-slim
  profiles: [services]
  restart: unless-stopped
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:' + process.env.PORT + '/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 180s # first start runs a full `yarn install`

x-node-dev-env: &node-dev-env
  NODE_ENV: development
  # File events from the macOS host don't reach the Podman VM, so tsx watch (chokidar) polls.
  CHOKIDAR_USEPOLLING: "true"
  CHOKIDAR_INTERVAL: "300"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_HOME: /cache/corepack
  YARN_GLOBAL_FOLDER: /cache/yarn
  # Container hostnames instead of the .env's localhost. Node's --env-file never overrides
  # variables that are already set, so .env still provides the secrets (JWT keys, OTP pepper).
  REDIS_URL: redis://redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Requests arrive through Apollo Router: take the client IP from X-Forwarded-For.
  TRUST_PROXY: "1"

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql
      # Creates one database per service on first start (empty volume only).
      # Existing volume? Create a new service's DB once by hand:
      #   podman compose exec postgres psql -U ecommerce -c 'CREATE DATABASE catalog;'
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    # AOF persistence so carts / BullMQ jobs survive restarts.
    # BullMQ requires maxmemory-policy=noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP (point the app's mailer here)
      - "127.0.0.1:8025:8025" # Web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  localstack:
    # AWS emulator for SNS, SQS and S3 (Phase 1 service events, catalog image uploads).
    # Requires an auth token (free Hobby plan at app.localstack.cloud). Without it the container
    # exits with code 55 and keeps restarting. Set LOCALSTACK_AUTH_TOKEN in the root .env (see .env.example).
    image: docker.io/localstack/localstack:latest
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs,s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566" # All AWS APIs: http://localhost:4566
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- API gateway (profile: apps) -----------------------------------------------------------------

  supergraph:
    # Composes services/api-gateway/supergraph.yaml into the supergraph-data volume, then polls every 2s
    # and recomposes on change. A failed composition keeps the last good supergraph.
    build: ./services/api-gateway/rover
    profiles: [apps]
    restart: unless-stopped
    volumes:
      # Same relative layout as the repo (the gateway sits next to the subgraphs), so the schema
      # paths in supergraph.yaml resolve.
      - ./services:/workspace/services:ro
      - supergraph-data:/supergraph
    healthcheck:
      test: ["CMD", "test", "-s", "/supergraph/supergraph.graphql"]
      interval: 3s
      timeout: 3s
      retries: 20

  router:
    image: ghcr.io/apollographql/router:v2.18.0
    profiles: [apps]
    restart: unless-stopped
    depends_on:
      supergraph:
        condition: service_healthy
    environment:
      APOLLO_ROUTER_CONFIG_PATH: /config/router.yaml
      APOLLO_ROUTER_SUPERGRAPH_PATH: /supergraph/supergraph.graphql
      APOLLO_ROUTER_HOT_RELOAD: "true" # reload on supergraph or router.yaml changes
      APOLLO_TELEMETRY_DISABLED: "true"
    # Podman defines host.containers.internal itself; this makes Docker (Linux/Windows) match.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000" # GraphQL + Sandbox: http://localhost:4000/graphql
      - "127.0.0.1:8088:8088" # Health: http://localhost:8088/health
      - "127.0.0.1:9080:9080" # Prometheus metrics: http://localhost:9080/metrics
    volumes:
      - ./services/api-gateway/router.yaml:/config/router.yaml:ro
      - ./services/api-gateway/rhai:/config/rhai:ro
      - supergraph-data:/supergraph:ro

  # --- Services in dev mode (profile: services) ---------------------------------------------------

  auth:
    <<: *node-dev
    working_dir: /workspace/services/auth
    # Install (fast after the first run thanks to the cache volume), migrate, then watch.
    command: ["sh", "-c", "corepack yarn install --immutable && corepack yarn db:migrate && exec corepack yarn dev"]
    environment:
      <<: *node-dev-env
      PORT: "4001"
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/auth
      # Keep Yarn's install state with the container's node_modules, not in the host's .yarn/.
      YARN_INSTALL_STATE_PATH: /workspace/services/auth/node_modules/.yarn-install-state.gz
    ports:
      - "127.0.0.1:4001:4001" # Subgraph: http://localhost:4001/graphql
    volumes:
      # Same layout as the repo, so the relative `portal:../../packages/service-kit` link resolves.
      # Uses the host's packages/service-kit/dist and node_modules: run `yarn install && yarn build`
      # there first (pure JS, so the macOS install works on Linux).
      - ./services/auth:/workspace/services/auth
      - ./packages/service-kit:/workspace/packages/service-kit:ro
      - auth-node_modules:/workspace/services/auth/node_modules
      - node-dev-cache:/cache

  # --- Observability (profile: apps) ---------------------------------------------------------------

  prometheus:
    # Scrape targets live in infra/observability/prometheus/prometheus.yml.
    image: docker.io/prom/prometheus:v3.15.0
    profiles: [apps]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # enables POST /-/reload
    # Subgraphs run on the host until Phase 2; same host alias as the router uses.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090" # UI + PromQL: http://localhost:9090
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    # Data source and dashboards are provisioned from infra/observability/grafana/ on startup.
    image: docker.io/grafana/grafana:13.2.3
    profiles: [apps]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local only (the port binds to 127.0.0.1): open as Admin without a login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000" # Dashboards: http://localhost:3000
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  localstack-data:
  supergraph-data:
  prometheus-data:
  grafana-data:
  node-dev-cache:
  auth-node_modules:
