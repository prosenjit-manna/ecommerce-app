              text: '{"query":"query Me {\n  me { id }\n}\n"}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('UNAUTHENTICATED', () => {
                  insomnia.expect(body.errors?.[0]?.extensions?.code).to.equal('UNAUTHENTICATED');
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: "me: bad token → UNAUTHENTICATED (INVALID)"
            meta:
              id: req_6ea41b7ba6b2264b7f2e752244fd1ae2
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: 'A malformed or wrongly signed token gives `extensions.reason: "INVALID"`. An expired one gives `"EXPIRED"` (refresh and retry), and a revoked session gives `"REVOKED"` (sign in again).'
              sortKey: -96800
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"query Me {\n  me { id }\n}\n"}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
              - name: Authorization
                value: Bearer not.a.real.token
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('UNAUTHENTICATED / INVALID', () => {
                  insomnia.expect(body.errors?.[0]?.extensions?.code).to.equal('UNAUTHENTICATED');
                  insomnia.expect(body.errors?.[0]?.extensions?.reason).to.equal('INVALID');
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: Refresh token reuse → session revoked
            meta:
              id: req_d19972bc9b93247318a909c143421edf
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                Demonstrates **reuse detection**. The pre-request script uses the saved refresh token once (which rotates it), then this request replays the **old** token. Result: `InvalidRefreshToken`, and the whole session is revoked, so the access token from that session stops working too.

                ⚠️ Ends the current session. Sign in again afterwards.
              sortKey: -96700
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation RefreshTokens($input: RefreshTokensInput!) {\n  refreshTokens(input: $input) { __typename ... on UserError { __typename message } }\n}\n","variables":{"input":{"refreshToken":"{{ _.refreshToken }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              preRequest: |-
                // Uses the current refresh token once (rotating it), then this request replays the OLD one.
                const old = insomnia.environment.get('refreshToken');
                const resp = await new Promise((resolve, reject) => {
                  insomnia.sendRequest({
                    url: insomnia.environment.get('apiGatewayUrl') + insomnia.environment.get('graphqlPath'),
                    method: 'POST',
                    header: [{ key: 'Content-Type', value: 'application/json' }],
                    body: {
                      mode: 'raw',
                      raw: JSON.stringify({
                        query: 'mutation($t: String!) { refreshTokens(input: { refreshToken: $t }) { __typename } }',
                        variables: { t: old },
                      }),
                    },
                  }, (err, res) => (err ? reject(err) : resolve(res)));
                });
                console.log('First use:', typeof resp.json === 'function' ? JSON.stringify(resp.json()) : resp.body);
                insomnia.environment.set('refreshToken', old);
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('refreshTokens returns InvalidRefreshToken', () => {
                  insomnia.expect(["InvalidRefreshToken"]).to.include(body.data?.refreshTokens?.__typename);
                });

                insomnia.environment.set('accessToken', '');
                insomnia.environment.set('refreshToken', '');
                console.log('Session revoked by reuse detection. Sign in again.');
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
      - name: Dev helpers
        meta:
          id: fld_d4caf038b07cff4edb10056ee481de36
          created: 1791460800000
          modified: 1791460800000
          sortKey: -96400
          description: Local-only helpers.
        children:
          - url: "{{ _.mailpitUrl }}/api/v1/search?limit=1&query=to%3A{{ _.email }}"
            name: Get latest OTP (Mailpit)
            meta:
              id: req_67a03e9d98cacc6a261fe0f260f4f27d
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              sortKey: -96500
              description: "Reads the newest email to `email` from Mailpit and saves the 6-digit code from its subject into `otpCode`. The verify requests already do this automatically when `autoFetchOtp` is true. Mailpit UI: {{ mailpitUrl }}"
            method: GET
            headers: []
            scripts:
              afterResponse: |-
                const msg = insomnia.response.json().messages?.[0];
                const code = msg?.Subject?.match(/(\d{6})$/)?.[1];
                insomnia.test('found a code', () => insomnia.expect(code).to.be.a('string'));
                if (code) insomnia.environment.set('otpCode', code);
                console.log(msg?.Subject);
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
