name: E-commerce API
meta:
  id: wrk_9264b3f7c3d9401ab37908fbc3e07777
  created: 1791460800000
  modified: 1791547200000
  description: |-
    # E-commerce API

    Every API in one collection, generated from `services/*/insomnia/collection.yaml` by `insomnia/build.mjs`. **Don't edit it in Insomnia:** the next build overwrites it. Edit a service's collection and run `yarn build` in `insomnia/`.

    **Routing:** GraphQL operations go through Apollo Router (`apiGatewayUrl`), like the mobile app. Federation queries (`_service`, `_entities`) and plain HTTP endpoints go straight to each service (`authUrl`, ...), because the router doesn't expose them.

    **Start:** `podman compose --profile apps up -d` for the router, `yarn dev` in each service, then pick the **local** environment.
collection:
  - name: API gateway
    meta:
      id: fld_960ae8f05e11cb90bf1242df2bbd24ed
      created: 1791547200000
      modified: 1791547200000
      sortKey: 0
      description: |-
        # API gateway (Apollo Router)

        The single client endpoint: `http://localhost:4000/graphql`. Start it with `podman compose --profile apps up -d`; subgraphs still run on the host with `yarn dev`.

        The router's own endpoints live on separate ports: health on `:8088`, Prometheus metrics on `:9080`. Cross-service flows (register → login → browse → cart → checkout) go here as the services get built.
    children:
      - name: Router
        meta:
          id: fld_755ae5bff43f7670bbb1c9eb8e942550
          created: 1791547200000
          modified: 1791547200000
          sortKey: -99900
          description: Is the router up, and is it serving a composed supergraph?
        children:
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: Smoke query (__typename)
            meta:
              id: req_6ca307692390c0e6cdaed80a0dfc7ac7
              created: 1791547200000
              modified: 1791547200000
              isPrivate: false
              description: |-
                # Smoke query
                The smallest query the router can plan. A `Query` answer means the supergraph composed and loaded.

                The router echoes `x-request-id` (set by `rhai/main.rhai`) on every response. Send your own `x-request-id` header to trace one request through every subgraph's logs.
              sortKey: -99900
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"query Smoke {\n  __typename\n}\n"}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('supergraph answers', () => {
                  insomnia.expect(body.data?.__typename).to.equal('Query');
                });

                insomnia.test('router echoes x-request-id', () => {
                  const id = insomnia.response.headers.find((h) => h.key.toLowerCase() === 'x-request-id')?.value;
                  insomnia.expect(id).to.be.a('string');
                  console.log('x-request-id', id);
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.routerHealthUrl }}/health"
            name: GET /health
            meta:
              id: req_921201f560a5e2f4cc680f37d59eaa06
              created: 1791547200000
              modified: 1791547200000
              isPrivate: false
              description: |-
                # GET /health
                Router liveness on its own port (`health_check` in `router.yaml`): `{ "status": "UP" }`. Used by compose, ECS and Kubernetes probes.
              sortKey: -99800
            method: GET
            headers:
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: insomnia.test('status 200', () => insomnia.expect(insomnia.response.code).to.equal(200));
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.routerMetricsUrl }}/metrics"
            name: GET /metrics
            meta:
              id: req_30199f98afa962aa80a62873cae59825
              created: 1791547200000
              modified: 1791547200000
              isPrivate: false
              description: |-
                # GET /metrics
                Prometheus metrics in text format: request counts, latency histograms and per-subgraph timings. Prometheus will scrape this later; it's on 9080 so it won't clash with Prometheus itself on 9090.
              sortKey: -99700
            method: GET
            headers:
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: insomnia.test('status 200', () => insomnia.expect(insomnia.response.code).to.equal(200));
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
  - name: Auth service
    meta:
      id: fld_0b5abda233c4e80e258e2eea2474d66a
      created: 1791460800000
      modified: 1791460800000
      sortKey: 1
      description: |-
        # Auth service API

        GraphQL subgraph for accounts, sign-in, tokens and device sessions. Directly on `http://localhost:4001/graphql`; through Apollo Router later (`gateway` environment).

        **Start here:** pick the **local** environment, then run *1. Sign up* → *signUp*, then *verifyEmail*. OTP codes are read from Mailpit automatically (`autoFetchOtp`), and the after-response scripts save `challengeId`, `accessToken`, `refreshToken` and `sessionId` for the next request.

        **Results:** expected failures are union members (check `__typename`) and all implement `UserError { message }`. Top-level `errors` mean auth failures (`UNAUTHENTICATED` with `extensions.reason`) or server errors.

        **Tokens:** access token = Ed25519 JWT, 15 min, sent as `Authorization: Bearer`. Refresh token = opaque, single-use, rotated on every refresh. Reusing one revokes the session.
    children:
      - name: 1. Sign up
        meta:
          id: fld_da7f4d7c16df128c5cf2a7d77c6efefc
          created: 1791460800000
          modified: 1791460800000
          sortKey: -99700
          description: |-
            Create an account, then confirm the email with the 6-digit code. Verifying the email also signs the user in.

            **Flow:** `signUp` → (code emailed) → `verifyEmail` → tokens saved to the environment.
        children:
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: signUp
            meta:
              id: req_070474c0f8d8dfd5f8a0031bfadfaceb
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # signUp
                Creates an account (email unverified) and emails a 6-digit **email verification** code.

                **Auth:** none · **Rate limit:** 5 per hour per IP

                | Input | Rules |
                |---|---|
                | `email` | valid email, stored lowercased |
                | `name` | 1–100 chars |
                | `password` | 8–128 chars, 3 of: lowercase, uppercase, digit, symbol; must not contain the email or name |
                | `device` | optional `DeviceInfoInput` (platform `ios`/`android`/`web`, deviceName, appVersion, deviceId) |

                | Result | When |
                |---|---|
                | `OtpChallenge` | Account created, code sent. Script saves `challengeId`. |
                | `EmailAlreadyRegistered` | Email is taken |
                | `WeakPassword` | `reasons` lists what to fix |
                | `ValidationError` | Bad input (`field` names it) |
                | `RateLimited` | Too many signups from this IP |

                GraphQL always answers HTTP 200. Expected failures come back as a **union member** (check `__typename`); every failure type implements `UserError { message }`. Top-level `errors` are only used for auth failures (`UNAUTHENTICATED`, `NOT_FOUND`) and unexpected server errors.
              sortKey: -99900
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation SignUp($input: SignUpInput!) {\n  signUp(input: $input) {\n    __typename\n    ... on OtpChallenge { challengeId purpose maskedEmail expiresAt resendAvailableAt }\n    ... on WeakPassword { reasons }\n    ... on ValidationError { field }\n    ... on RateLimited { retryAfterSeconds }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"email":"{{ _.email }}","name":"{{ _.name }}","password":"{{ _.password }}","device":{"platform":"{{ _.devicePlatform }}","deviceName":"{{ _.deviceName }}","appVersion":"{{ _.appVersion }}","deviceId":"{{ _.deviceId }}"}}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('signUp returns OtpChallenge', () => {
                  insomnia.expect(["OtpChallenge"]).to.include(body.data?.signUp?.__typename);
                });

                const challenge = body.data?.signUp?.challenge ?? body.data?.signUp;
                if (challenge?.challengeId) {
                  insomnia.environment.set('challengeId', challenge.challengeId);
                  console.log('Saved challengeId', challenge.challengeId);
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: verifyEmail
            meta:
              id: req_966646be42e6b36b9c13b88ce03d0b8f
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # verifyEmail
                Confirms the email with the code from `signUp` (or from a login on an unverified account) and **signs the user in**: creates a session and returns tokens.

                **Auth:** none · **Rate limit:** 20 per 15 min per IP, and 5 wrong codes per challenge

                Locally the pre-request script reads the code from Mailpit (`autoFetchOtp`), so you can just press Send.

                | Result | When |
                |---|---|
                | `AuthSuccess` | user + session + tokens. Script saves `accessToken`, `refreshToken`, `sessionId`. |
                | `InvalidOtp` | Wrong code; `attemptsRemaining` counts down from 5 |
                | `OtpExpired` | Expired (10 min), already used, or unknown challenge |
                | `AccountDisabled` | Account is disabled |
              sortKey: -99800
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation VerifyEmail($input: VerifyEmailInput!) {\n  verifyEmail(input: $input) {\n    __typename\n    ... on AuthSuccess {\n    user { id email name role emailVerified twoFactorEnabled createdAt }\n    session { id isCurrent loginMethod device { type name os browser platform appVersion } ipAddress lastIpAddress location { city region country countryCode } createdAt lastSeenAt expiresAt }\n    tokens { accessToken accessTokenExpiresAt refreshToken refreshTokenExpiresAt }\n  }\n    ... on InvalidOtp { attemptsRemaining }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"challengeId":"{{ _.challengeId }}","code":"{{ _.otpCode }}","device":{"platform":"{{ _.devicePlatform }}","deviceName":"{{ _.deviceName }}","appVersion":"{{ _.appVersion }}","deviceId":"{{ _.deviceId }}"}}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              preRequest: |-
                // Local only: read the newest code for this email from Mailpit (subject ends with the 6-digit code).
                // Turn off with autoFetchOtp=false, or paste the code into otpCode yourself.
                if (insomnia.environment.get('autoFetchOtp') === true || insomnia.environment.get('autoFetchOtp') === 'true') {
                  const mailpit = insomnia.environment.get('mailpitUrl');
                  const email = insomnia.environment.get('email');
                  const url = mailpit + '/api/v1/search?limit=1&query=' + encodeURIComponent('to:' + email);
                  const resp = await new Promise((resolve, reject) => {
                    insomnia.sendRequest(url, (err, res) => (err ? reject(err) : resolve(res)));
                  });
                  const data = typeof resp.json === 'function' ? resp.json() : JSON.parse(resp.body ?? resp.text());
                  const code = data.messages?.[0]?.Subject?.match(/(\d{6})$/)?.[1];
                  if (code) {
                    insomnia.environment.set('otpCode', code);
                    console.log('Fetched OTP from Mailpit:', code);
                  } else {
                    console.warn('No OTP email found in Mailpit for', email);
                  }
                }
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('verifyEmail returns AuthSuccess', () => {
                  insomnia.expect(["AuthSuccess"]).to.include(body.data?.verifyEmail?.__typename);
                });

                const tokens = body.data?.verifyEmail.tokens;
                if (tokens?.accessToken) {
                  insomnia.environment.set('accessToken', tokens.accessToken);
                  insomnia.environment.set('refreshToken', tokens.refreshToken);
                  console.log('Saved accessToken + refreshToken');
                }

                const session = body.data?.verifyEmail?.session;
                if (session?.id) insomnia.environment.set('sessionId', session.id);
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
      - name: 2. Login
        meta:
          id: fld_233cf24c2f167fbcc00749069d34816b
          created: 1791460800000
          modified: 1791460800000
          sortKey: -99300
          description: |-
            Sign-in is two steps when two-factor is on (the default): password first, then the emailed code.

            **Flow:** `login` → `OtpChallenge` → (code emailed) → `verifyLoginOtp` → tokens. With two-factor off, `login` returns `AuthSuccess` directly.
        children:
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: login
            meta:
              id: req_99176c0d1b7dd90568ad5dcb55c69159
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # login
                Step 1 of sign-in: checks the password.

                **Auth:** none · **Rate limits:** 10 per 15 min per IP+email, 100 per day per IP. After **10 wrong passwords in a row** the email is locked for 15 min (reset on a correct password).

                | Result | When |
                |---|---|
                | `OtpChallenge` | Password OK and two-factor on (default): a **login** code was emailed. Script saves `challengeId`; continue with `verifyLoginOtp`. |
                | `AuthSuccess` | Password OK and two-factor off: signed in. Script saves the tokens. |
                | `EmailNotVerified` | Password OK but the email isn't verified: a new verification code was sent. Continue with `verifyEmail` using `challenge.challengeId` (the script saves it). |
                | `InvalidCredentials` | Unknown email or wrong password (same answer for both, on purpose) |
                | `AccountDisabled` | Account is disabled |
                | `RateLimited` | See limits above |

                The device (`DeviceInfoInput` plus the `User-Agent` header) and IP are recorded on the session created in step 2.
              sortKey: -99600
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation Login($input: LoginInput!) {\n  login(input: $input) {\n    __typename\n    ... on OtpChallenge { challengeId purpose maskedEmail expiresAt resendAvailableAt }\n    ... on AuthSuccess {\n    user { id email name role emailVerified twoFactorEnabled createdAt }\n    session { id isCurrent loginMethod device { type name os browser platform appVersion } ipAddress lastIpAddress location { city region country countryCode } createdAt lastSeenAt expiresAt }\n    tokens { accessToken accessTokenExpiresAt refreshToken refreshTokenExpiresAt }\n  }\n    ... on EmailNotVerified { challenge { challengeId purpose maskedEmail expiresAt } }\n    ... on RateLimited { retryAfterSeconds }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"email":"{{ _.email }}","password":"{{ _.password }}","device":{"platform":"{{ _.devicePlatform }}","deviceName":"{{ _.deviceName }}","appVersion":"{{ _.appVersion }}","deviceId":"{{ _.deviceId }}"}}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('login returns OtpChallenge or AuthSuccess', () => {
                  insomnia.expect(["OtpChallenge","AuthSuccess"]).to.include(body.data?.login?.__typename);
                });

                const challenge = body.data?.login?.challenge ?? body.data?.login;
                if (challenge?.challengeId) {
                  insomnia.environment.set('challengeId', challenge.challengeId);
                  console.log('Saved challengeId', challenge.challengeId);
                }

                const tokens = body.data?.login.tokens;
                if (tokens?.accessToken) {
                  insomnia.environment.set('accessToken', tokens.accessToken);
                  insomnia.environment.set('refreshToken', tokens.refreshToken);
                  console.log('Saved accessToken + refreshToken');
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: verifyLoginOtp
            meta:
              id: req_1961e8a4d477f4fc307289cb1da9b546
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # verifyLoginOtp
                Step 2 of sign-in: the emailed code. Creates the device session and returns tokens. Sends a "new sign-in" email if this device hasn't been seen before.

                **Auth:** none · **Rate limit:** 20 per 15 min per IP, and 5 wrong codes per challenge

                | Result | When |
                |---|---|
                | `AuthSuccess` | Script saves `accessToken`, `refreshToken`, `sessionId` |
                | `InvalidOtp` | Wrong code; `attemptsRemaining` |
                | `OtpExpired` | Expired, used, or unknown challenge |
                | `AccountDisabled` | Account was disabled in between |
              sortKey: -99500
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation VerifyLoginOtp($input: VerifyLoginOtpInput!) {\n  verifyLoginOtp(input: $input) {\n    __typename\n    ... on AuthSuccess {\n    user { id email name role emailVerified twoFactorEnabled createdAt }\n    session { id isCurrent loginMethod device { type name os browser platform appVersion } ipAddress lastIpAddress location { city region country countryCode } createdAt lastSeenAt expiresAt }\n    tokens { accessToken accessTokenExpiresAt refreshToken refreshTokenExpiresAt }\n  }\n    ... on InvalidOtp { attemptsRemaining }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"challengeId":"{{ _.challengeId }}","code":"{{ _.otpCode }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              preRequest: |-
                // Local only: read the newest code for this email from Mailpit (subject ends with the 6-digit code).
                // Turn off with autoFetchOtp=false, or paste the code into otpCode yourself.
                if (insomnia.environment.get('autoFetchOtp') === true || insomnia.environment.get('autoFetchOtp') === 'true') {
                  const mailpit = insomnia.environment.get('mailpitUrl');
                  const email = insomnia.environment.get('email');
                  const url = mailpit + '/api/v1/search?limit=1&query=' + encodeURIComponent('to:' + email);
                  const resp = await new Promise((resolve, reject) => {
                    insomnia.sendRequest(url, (err, res) => (err ? reject(err) : resolve(res)));
                  });
                  const data = typeof resp.json === 'function' ? resp.json() : JSON.parse(resp.body ?? resp.text());
                  const code = data.messages?.[0]?.Subject?.match(/(\d{6})$/)?.[1];
                  if (code) {
                    insomnia.environment.set('otpCode', code);
                    console.log('Fetched OTP from Mailpit:', code);
                  } else {
                    console.warn('No OTP email found in Mailpit for', email);
                  }
                }
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('verifyLoginOtp returns AuthSuccess', () => {
                  insomnia.expect(["AuthSuccess"]).to.include(body.data?.verifyLoginOtp?.__typename);
                });

                const tokens = body.data?.verifyLoginOtp.tokens;
                if (tokens?.accessToken) {
                  insomnia.environment.set('accessToken', tokens.accessToken);
                  insomnia.environment.set('refreshToken', tokens.refreshToken);
                  console.log('Saved accessToken + refreshToken');
                }

                const session = body.data?.verifyLoginOtp?.session;
                if (session?.id) insomnia.environment.set('sessionId', session.id);
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: resendOtp
            meta:
              id: req_21b0d61c33ef94023ae20c7abc2f4a77
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # resendOtp
                Emails a **new** code for an open challenge (any purpose). The old code stops working, the attempt counter resets and the expiry restarts.

                **Auth:** none · **Limits:** 60 s cooldown between sends (see `resendAvailableAt`), 5 sends per challenge, 10 sends per hour per email

                | Result | When |
                |---|---|
                | `OtpChallenge` | New code sent |
                | `RateLimited` | Cooldown or caps hit; `retryAfterSeconds` |
                | `OtpExpired` | Challenge unknown or already used |
              sortKey: -99400
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation ResendOtp($input: ResendOtpInput!) {\n  resendOtp(input: $input) {\n    __typename\n    ... on OtpChallenge { challengeId purpose maskedEmail expiresAt resendAvailableAt }\n    ... on RateLimited { retryAfterSeconds }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"challengeId":"{{ _.challengeId }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('resendOtp returns OtpChallenge or RateLimited', () => {
                  insomnia.expect(["OtpChallenge","RateLimited"]).to.include(body.data?.resendOtp?.__typename);
                });

                if (body.data?.resendOtp?.__typename === 'RateLimited') console.log('Cooldown: wait', body.data.resendOtp.retryAfterSeconds, 's');
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
      - name: 3. Tokens
        meta:
          id: fld_7e3be12ffccdf35169c2c9ee72d7dca3
          created: 1791460800000
          modified: 1791460800000
          sortKey: -99100
          description: Access tokens last 15 minutes. Exchange the refresh token for a new pair before (or when) the access token expires.
        children:
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: refreshTokens
            meta:
              id: req_85bb1e8c231d0215e08998c90b9e696b
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # refreshTokens
                Returns a new access token **and a new refresh token**. Refresh tokens are **single-use**: the old one stops working immediately.

                **Auth:** none (the refresh token is the credential) · **Rate limit:** 60 per minute per IP

                **Reuse detection:** sending an already-used refresh token is treated as theft. The whole session is revoked, so both copies stop working and the user must sign in again. Try it: send this request, then send the same body again by turning off the after-response script, or use *Error cases → Refresh token reuse*.

                | Result | When |
                |---|---|
                | `AuthTokens` | Script saves the new pair |
                | `InvalidRefreshToken` | Unknown, expired (30 days sliding, 90 days max per session), reused, or the session was revoked |
                | `RateLimited` | Too many refreshes from this IP |
              sortKey: -99200
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation RefreshTokens($input: RefreshTokensInput!) {\n  refreshTokens(input: $input) {\n    __typename\n    ... on AuthTokens { accessToken accessTokenExpiresAt refreshToken refreshTokenExpiresAt }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"refreshToken":"{{ _.refreshToken }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('refreshTokens returns AuthTokens', () => {
                  insomnia.expect(["AuthTokens"]).to.include(body.data?.refreshTokens?.__typename);
                });

                const tokens = body.data?.refreshTokens;
                if (tokens?.accessToken) {
                  insomnia.environment.set('accessToken', tokens.accessToken);
                  insomnia.environment.set('refreshToken', tokens.refreshToken);
                  console.log('Saved accessToken + refreshToken');
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
      - name: 4. Password reset
        meta:
          id: fld_5c94e8d4f53808da942247538134b559
          created: 1791460800000
          modified: 1791460800000
          sortKey: -98800
          description: Forgot password → code by email → set a new password. A reset **signs out every device**.
        children:
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: forgotPassword
            meta:
              id: req_947316ef0e7863ad256c6a18cf0f51b4
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # forgotPassword
                Emails a **password reset** code.

                **Auth:** none · **Rate limits:** 3 per hour per email, 10 per hour per IP

                Always returns `OtpChallenge`, **even for emails with no account**. No email is sent then, and the challenge can never be verified. This keeps the endpoint from revealing who is registered.
              sortKey: -99000
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation ForgotPassword($input: ForgotPasswordInput!) {\n  forgotPassword(input: $input) {\n    __typename\n    ... on OtpChallenge { challengeId purpose maskedEmail expiresAt resendAvailableAt }\n    ... on RateLimited { retryAfterSeconds }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"email":"{{ _.email }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('forgotPassword returns OtpChallenge', () => {
                  insomnia.expect(["OtpChallenge"]).to.include(body.data?.forgotPassword?.__typename);
                });

                const challenge = body.data?.forgotPassword?.challenge ?? body.data?.forgotPassword;
                if (challenge?.challengeId) {
                  insomnia.environment.set('challengeId', challenge.challengeId);
                  console.log('Saved challengeId', challenge.challengeId);
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.apiGatewayUrl }}{{ _.graphqlPath }}"
            name: resetPassword
            meta:
              id: req_9ce2aece3d9733125abeb00a018167dd
              created: 1791460800000
              modified: 1791460800000
              isPrivate: false
              description: |-
                # resetPassword
                Sets a new password using the code from `forgotPassword`.

                **Auth:** none · **Rate limit:** 20 per 15 min per IP, and 5 wrong codes per challenge

                Side effects: **all sessions are revoked** (every device signed out, live access tokens rejected immediately), the email counts as verified, the login lockout is cleared, and a "password changed" email is sent.

                The password is checked **before** the code, so a weak password doesn't use up the code.

                | Result | When |
                |---|---|
                | `PasswordResetSuccess` | Done. Script clears the saved tokens. |
                | `WeakPassword` | Fix `newPassword` and retry with the same code |
                | `InvalidOtp` / `OtpExpired` | Wrong, expired or used code |

                After a reset, put the new password into `password` before running **login** again.
              sortKey: -98900
            method: POST
            body:
              mimeType: application/graphql
              text: '{"query":"mutation ResetPassword($input: ResetPasswordInput!) {\n  resetPassword(input: $input) {\n    __typename\n    ... on PasswordResetSuccess { message }\n    ... on InvalidOtp { attemptsRemaining }\n    ... on WeakPassword { reasons }\n    ... on UserError { __typename message }\n  }\n}\n","variables":{"input":{"challengeId":"{{ _.challengeId }}","code":"{{ _.otpCode }}","newPassword":"{{ _.newPassword }}"}}}'
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: "{{ _.userAgent }}"
            scripts:
              preRequest: |-
                // Local only: read the newest code for this email from Mailpit (subject ends with the 6-digit code).
                // Turn off with autoFetchOtp=false, or paste the code into otpCode yourself.
                if (insomnia.environment.get('autoFetchOtp') === true || insomnia.environment.get('autoFetchOtp') === 'true') {
                  const mailpit = insomnia.environment.get('mailpitUrl');
                  const email = insomnia.environment.get('email');
                  const url = mailpit + '/api/v1/search?limit=1&query=' + encodeURIComponent('to:' + email);
                  const resp = await new Promise((resolve, reject) => {
                    insomnia.sendRequest(url, (err, res) => (err ? reject(err) : resolve(res)));
                  });
                  const data = typeof resp.json === 'function' ? resp.json() : JSON.parse(resp.body ?? resp.text());
                  const code = data.messages?.[0]?.Subject?.match(/(\d{6})$/)?.[1];
                  if (code) {
                    insomnia.environment.set('otpCode', code);
                    console.log('Fetched OTP from Mailpit:', code);
                  } else {
                    console.warn('No OTP email found in Mailpit for', email);
                  }
                }
              afterResponse: |-
                const body = insomnia.response.json();

                insomnia.test('resetPassword returns PasswordResetSuccess', () => {
                  insomnia.expect(["PasswordResetSuccess"]).to.include(body.data?.resetPassword?.__typename);
                });

                if (body.data?.resetPassword?.__typename === 'PasswordResetSuccess') {
                  // Every session was revoked, so the saved tokens are dead now.
                  insomnia.environment.set('accessToken', '');
                  insomnia.environment.set('refreshToken', '');
                  console.log('Password changed. Swap password/newPassword in the environment before logging in again.');
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
