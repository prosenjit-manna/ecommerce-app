        headers: []
        scripts:
          afterResponse: |-
            const msg = insomnia.response.json().messages?.[0];
            const code = msg?.Subject?.match(/(\d{6})$/)?.[1];
            insomnia.test('found a code', () => insomnia.expect(code).to.be.a('string'));
            if (code) insomnia.environment.set('otpCode', code);
            console.log(msg?.Subject);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
